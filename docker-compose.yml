services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai_engineer_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_engineer_embeddings
    ports:
      - "5433:5432"
    volumes:
      - ai_engineer_pgvector_data:/var/lib/postgresql/data

volumes:
  ai_engineer_pgvector_data:
    name: ai_engineer_pgvector_data
