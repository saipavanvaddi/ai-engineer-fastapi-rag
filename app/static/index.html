<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Embeddings Tester</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #9aa4b2;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  p.sub {
    color: var(--muted);
    margin-top: 0;
    font-size: 14px;
  }
  form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  textarea {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    resize: vertical;
    min-height: 70px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    align-self: flex-start;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #result {
    margin-top: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row span:first-child { color: var(--muted); }
  code {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    max-height: 160px;
    overflow: auto;
    word-break: break-all;
  }
  .error {
    color: #f28b82;
    font-size: 14px;
  }
  section {
    margin-top: 40px;
  }
  section h1 {
    margin-bottom: 4px;
  }
  input[type="text"], input[type="number"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
  }
  .number-row {
    display: flex;
    gap: 12px;
  }
  .number-row label {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .chunk-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .chunk-item:last-child { border-bottom: none; }
  .chunk-item .chunk-id { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .bar-track {
    background: var(--bg);
    border-radius: 6px;
    height: 8px;
    margin-top: 6px;
    overflow: hidden;
  }
  .bar-fill {
    background: var(--accent);
    height: 100%;
  }
  .result-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .result-item:last-child { border-bottom: none; }
  .result-item .row span:last-child { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <section>
    <h1>Embeddings Tester</h1>
    <p class="sub">POST /api/embeddings — converts text into a vector</p>

    <form id="embed-form">
      <textarea id="text" placeholder="Chicken biryani costs 250 rupees" required></textarea>
      <button type="submit" id="submit-btn">Get embedding</button>
    </form>

    <div id="result"></div>
  </section>

  <section>
    <h1>Similarity Search</h1>
    <p class="sub">POST /api/embeddings/similarity — ranks sentences by relevance to a query</p>

    <form id="similarity-form">
      <input type="text" id="sim-query" placeholder="How much does chicken biryani cost?" required>
      <textarea id="sim-sentences" placeholder="One sentence per line&#10;Chicken biryani costs 250 rupees.&#10;The delivery partner is 10 minutes away.&#10;Veg meals are available for 180 rupees." required></textarea>
      <button type="submit" id="sim-submit-btn">Rank by similarity</button>
    </form>

    <div id="sim-result"></div>
  </section>

  <section>
    <h1>Chunk + Embed</h1>
    <p class="sub">POST /api/embeddings/chunk — splits text into overlapping chunks and embeds each one</p>

    <form id="chunk-form">
      <textarea id="chunk-text" placeholder="Paste a longer document here..." required></textarea>
      <div class="number-row">
        <label>Chunk size (words)
          <input type="number" id="chunk-size" value="20" min="1" required>
        </label>
        <label>Overlap (words)
          <input type="number" id="chunk-overlap" value="5" min="0" required>
        </label>
      </div>
      <button type="submit" id="chunk-submit-btn">Chunk &amp; embed</button>
    </form>

    <div id="chunk-result"></div>
  </section>
</main>

<script>
  const form = document.getElementById("embed-form");
  const resultEl = document.getElementById("result");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const text = document.getElementById("text").value.trim();
    if (!text) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Loading...";
    resultEl.innerHTML = "";

    try {
      const response = await fetch("/api/embeddings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });

      if (!response.ok) {
        const detail = await response.text();
        throw new Error(`${response.status}: ${detail}`);
      }

      const data = await response.json();
      const preview = data.embedding.slice(0, 8).map(n => n.toFixed(4)).join(", ");

      resultEl.innerHTML = `
        <div class="card">
          <div class="row"><span>Text</span><span>${data.text}</span></div>
          <div class="row"><span>Dimensions</span><span>${data.dimensions}</span></div>
          <code>[${preview}, ...]</code>
        </div>
      `;
    } catch (err) {
      resultEl.innerHTML = `<p class="error">${err.message}</p>`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Get embedding";
    }
  });

  const simForm = document.getElementById("similarity-form");
  const simResultEl = document.getElementById("sim-result");
  const simSubmitBtn = document.getElementById("sim-submit-btn");

  simForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const query = document.getElementById("sim-query").value.trim();
    const sentences = document.getElementById("sim-sentences").value
      .split("\n")
      .map(line => line.trim())
      .filter(line => line.length > 0);

    if (!query || sentences.length === 0) return;

    simSubmitBtn.disabled = true;
    simSubmitBtn.textContent = "Loading...";
    simResultEl.innerHTML = "";

    try {
      const response = await fetch("/api/embeddings/similarity", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, sentences }),
      });

      if (!response.ok) {
        const detail = await response.text();
        throw new Error(`${response.status}: ${detail}`);
      }

      const data = await response.json();

      const items = data.results.map(r => {
        const pct = Math.max(0, r.similarity) * 100;
        return `
          <div class="result-item">
            <div class="row"><span>${r.sentence}</span><span>${r.similarity.toFixed(4)}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          </div>
        `;
      }).join("");

      simResultEl.innerHTML = `<div class="card">${items}</div>`;
    } catch (err) {
      simResultEl.innerHTML = `<p class="error">${err.message}</p>`;
    } finally {
      simSubmitBtn.disabled = false;
      simSubmitBtn.textContent = "Rank by similarity";
    }
  });

  const chunkForm = document.getElementById("chunk-form");
  const chunkResultEl = document.getElementById("chunk-result");
  const chunkSubmitBtn = document.getElementById("chunk-submit-btn");

  chunkForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const text = document.getElementById("chunk-text").value.trim();
    const chunk_size = parseInt(document.getElementById("chunk-size").value, 10);
    const overlap = parseInt(document.getElementById("chunk-overlap").value, 10);

    if (!text) return;

    chunkSubmitBtn.disabled = true;
    chunkSubmitBtn.textContent = "Loading...";
    chunkResultEl.innerHTML = "";

    try {
      const response = await fetch("/api/embeddings/chunk", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, chunk_size, overlap }),
      });

      if (!response.ok) {
        const detail = await response.text();
        throw new Error(`${response.status}: ${detail}`);
      }

      const data = await response.json();

      const items = data.chunks.map(c => `
        <div class="chunk-item">
          <div class="chunk-id">Chunk ${c.chunk_id} · ${c.dimensions} dims</div>
          <div>${c.text}</div>
        </div>
      `).join("");

      chunkResultEl.innerHTML = `
        <div class="card">
          <div class="row"><span>Total chunks</span><span>${data.total_chunks}</span></div>
        </div>
        <div class="card" style="margin-top:12px">${items}</div>
      `;
    } catch (err) {
      chunkResultEl.innerHTML = `<p class="error">${err.message}</p>`;
    } finally {
      chunkSubmitBtn.disabled = false;
      chunkSubmitBtn.textContent = "Chunk & embed";
    }
  });
</script>
</body>
</html>
